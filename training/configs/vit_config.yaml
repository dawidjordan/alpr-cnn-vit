
experiment:
  name: "ViT_classifier_v1"
  family: "ViT"
  seed: 42
  output_dir: "outputs/vit/"

model:
  architecture: "vit_base_patch16_224"  
                                          
  pretrained: true                        
  num_classes: 10
  dropout: 0.1
  input_size: 224

data:
  dataset: "compcars"
  data_dir: "data/processed/"
  splits_dir: "data/splits/"
  num_workers: 4
  pin_memory: true

 
  augmentation:
    horizontal_flip: 0.5
    random_resized_crop:
      scale: [0.8, 1.0]
    color_jitter:
      brightness: 0.4
      contrast: 0.4
      saturation: 0.3
      hue: 0.1
    random_erasing: 0.25          
    mixup_alpha: 0.2              
    cutmix_alpha: 1.0            
    normalize:
      mean: [0.485, 0.456, 0.406]
      std:  [0.229, 0.224, 0.225]

training:
  stage1:
    description: "Fine-tuning całego ViT z małym LR"
    epochs: 50
    batch_size: 32               
    optimizer: "adamw"
    lr: 1.0e-4                    
    weight_decay: 0.05         
    freeze_backbone: false
    gradient_clip: 1.0           

  scheduler:
    type: "cosine_annealing_warmup"
    warmup_epochs: 5             
    T_max: 45
    eta_min: 1.0e-6

  early_stopping:
    patience: 12                 
    monitor: "val_accuracy"
    mode: "max"

  save_best: true
  save_every_n_epochs: 10

logging:
  use_wandb: true
  project: "alpr-thesis"
  use_tensorboard: true
  log_dir: "runs/vit/"
