
experiment:
  name: "CNN_classifier_v1"
  family: "CNN"
  seed: 42
  output_dir: "outputs/cnn/"

model:
  architecture: "resnet50"        
  pretrained: true
  num_classes: 10                 
  dropout: 0.3
  input_size: 224                 

data:
  dataset: "compcars"             
  data_dir: "data/processed/"
  splits_dir: "data/splits/"
  num_workers: 4
  pin_memory: true


  augmentation:
    horizontal_flip: 0.5
    random_crop: true
    color_jitter:
      brightness: 0.3
      contrast: 0.3
      saturation: 0.2
      hue: 0.1
    random_rotation: 10           
    normalize:
      mean: [0.485, 0.456, 0.406] 
      std:  [0.229, 0.224, 0.225]

training:
  
  stage1:
    description: "Trenowanie tylko głowicy (backbone zamrożony)"
    epochs: 10
    batch_size: 64
    optimizer: "adamw"
    lr: 1.0e-3
    weight_decay: 1.0e-4
    freeze_backbone: true

  stage2:
    description: "Fine-tuning całego modelu"
    epochs: 30
    batch_size: 32
    optimizer: "adamw"
    lr: 1.0e-4
    weight_decay: 1.0e-4
    freeze_backbone: false
    unfreeze_from_layer: 6       

  scheduler:
    type: "cosine_annealing"
    T_max: 30
    eta_min: 1.0e-6

  early_stopping:
    patience: 8
    monitor: "val_accuracy"
    mode: "max"

 
  save_best: true
  save_every_n_epochs: 5

logging:
  use_wandb: true
  project: "alpr-thesis"
  use_tensorboard: true
  log_dir: "runs/cnn/"
